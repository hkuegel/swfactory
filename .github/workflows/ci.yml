name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs on main are serialised, and a run that has started is never cancelled (a deployment must not be cut
# off); newer runs of a pull request cancel older ones. A run that is still queued in the same group is
# cancelled by GitHub whatever cancel-in-progress says, so a main push that arrives while another main run
# is going can lose its run (run #39 on 2026-11-14 was cancelled while queued, hak's decision of
# 2026-11-14 to state this as reality rather than as a promise).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Story 026: one job, one install, one build. A run that publishes to main or a
  # workflow_dispatch run is always a full run (AC4); a pull-request run may use the mapping, so a
  # change that can only affect the markdown does not start a browser at all (AC1, AC2).
  # node_modules comes from the cache keyed on the lockfile hash and is installed only on a miss (AC7).
  # _site/ is built once, by the plan, and never rebuilt (AC6).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth 0 so the runner can read what changed since the recorded full run.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        id: deps
        with:
          # Story 028: the cache also holds the vitest cache of each workspace, which lives in its own
          # node_modules and is not part of the root one.
          path: |
            node_modules
            apps/*/node_modules/.vite
            packages/*/node_modules/.vite
            landing/node_modules/.vite
          key: node_modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.deps.outputs.cache-hit != 'true'
      - name: plan
        id: plan
        env:
          MODE: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'full' || 'affected' }}
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/verify.mjs --plan-only --format=github-output --mode="$MODE" --base="$BASE" --no-record >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        # Story 028: the browser is read from the cache only when the plan has a browser step, so a
        # markdown-only round does not touch it (AC3). The key is the lockfile hash, which carries the
        # Playwright version (AC2).
        if: contains(steps.plan.outputs.steps, 'test:e2e') || contains(steps.plan.outputs.steps, 'test:pages')
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: browsers
        run: npx playwright install --with-deps chromium
        if: (contains(steps.plan.outputs.steps, 'test:e2e') || contains(steps.plan.outputs.steps, 'test:pages')) && steps.browsers.outputs.cache-hit != 'true'
      - name: checks
        # Story 025, hak's CI decision of 2026-11-14: the checks step runs in fixture/local mode, so a test
        # run reads stored data and never the source. `local` is the mode a test run has (ADR 0014), and
        # `fixture` names the fund data it reads, which is the source the app test that proves the fixture
        # copy depends on; here it is named by the run instead of falling back to a default. The live part
        # is not a test run: it runs as its own step after the publish, in the deploy job below.
        env:
          VITE_TEST_MODE: local
          LAZ_FUND: fixture
        run: node scripts/verify.mjs --mode=${{ steps.plan.outputs.mode }} --base=${{ steps.plan.outputs.base }} --no-record
      - name: report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: verify-report
          path: |
            apps/*/playwright-report
            apps/*/test-results
            packages/platform/test-results
      # Only a full run publishes, so the artifact is always there when the deployment runs (AC4, AC6).
      - name: publish
        uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: _site

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the Pages deployment
      id-token: write # OIDC token that proves the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Story 025, hak's CI decision of 2026-11-14: the live part runs here, after the publish, in its own
      # step. This job has no write permission, so the writer runs in `--frozen` mode: it reads the live
      # pages, writes nothing, and names each difference with the committed file. A result that does not fit
      # ends the step red, so a CI run can never publish a file its own checks would contradict. The `--full`
      # write belongs to the UI-triggered workflow, the only workflow with contents: write, and that run
      # refuses to write when its result does not fit either.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: live comparison in frozen mode, writes nothing
        env:
          LAZ_FUND: committed
        run: |
          node scripts/write-fund-list.mjs \
            --mode=live --frozen \
            --run-date="$(date -u +%Y-%m-%d)" \
            --out=apps/laz/src/features/plan/data/fund-list.json
