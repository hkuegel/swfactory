name: zz-diag
on:
  push:
    branches: ['fix/019-**']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          nproc; free -m; fc-list | sed 's/:.*style/ style/' | sort | uniq | head -60
          echo "--- fc-match"; for f in system-ui sans-serif "Segoe UI" Roboto; do fc-match "$f"; done
      - run: |
          mkdir -p diag
          npm run test:e2e -w apps/avd -- zz-diag --retries=0 || true
          cp -r apps/avd/test-results/zz-diag diag/avd || true
      - run: |
          npm run test:e2e -w apps/minesweeper -- zz-diag2 --retries=0 --project=chromium || true
          cp -r apps/minesweeper/test-results/zz-diag diag/minesweeper || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag
          path: diag

